# Include in nginx's http context. In the existing /editor/ proxy location,
# add: expires $editor_icon_expires;
map "$request_method:$uri:$upstream_status:$upstream_http_content_type" $editor_icon_expires {
    default off;
    "~^(GET|HEAD):/editor/_static/src/browser/media/(pwa-icon(-maskable)?-(192|512)\.png|favicon(-dark-support\.svg|\.ico)):((200|206):image/|304:$)" 1d;
}
